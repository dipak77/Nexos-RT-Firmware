[platformio]
src_dir = main
default_envs = esp32s3_arduino

; Arduino Next OS bring-up. Sources live in src/;
; arduino_main.cpp pulls them in so IDF can keep src_dir=main.
[env:esp32s3_arduino]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
; Arduino uploader writes app at 0x10000; ota.csv expects 0x20000 -> bootloop + dark glass.
board_build.partitions = partitions_8mb_arduino.csv
build_src_filter =
    +<arduino_main.cpp>
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit GC9A01A @ ^1.1.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    BLE
    WiFi
extra_scripts =
    pre:tools/pio_kernel_sources.py
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -I src
    -I components/microkernel/include

[env:esp32s3_idf]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb_ota.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
extra_scripts =
    pre:tools/pio_extra_script.py
